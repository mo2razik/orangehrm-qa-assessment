# ------------------------------------------------------------------
# Environment configuration
# Every key can be overridden at runtime with -D<key>=<value>
# (e.g. mvn test -Dbrowser=firefox -Dheadless=true)
# Credentials can also be supplied via environment variables
# ORANGEHRM_USERNAME / ORANGEHRM_PASSWORD.
# ------------------------------------------------------------------

base.url=https://opensource-demo.orangehrmlive.com/web/index.php

# Demo credentials published on the OrangeHRM demo login page
app.username=Admin
app.password=admin123

# chrome | firefox | edge
browser=chrome
headless=false
window.width=1920
window.height=1080

# Timeouts (seconds)
timeout.explicit=20
timeout.page.load=60

# Test data
test.data.prefix=Automation
test.data.middle.name=Test
leave.min.days.ahead=7
leave.max.days.ahead=45
leave.entitlement.days=10

# Delete employees created during execution once the suite finishes
cleanup.enabled=true

# Output
screenshots.dir=target/screenshots
